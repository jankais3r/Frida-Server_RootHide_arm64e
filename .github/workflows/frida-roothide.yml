name: Frida RootHide arm64e

on:
  schedule:
    - cron: "17,47 * * * *"

  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Frida version; blank means latest stable"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: frida-roothide-arm64e
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_work: ${{ steps.discover.outputs.has_work }}

    steps:
      - name: Discover unbuilt upstream releases
        id: discover
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          FRIDA_SINCE: ${{ vars.FRIDA_SINCE }}
        with:
          script: |
            const upstream = { owner: "frida", repo: "frida" };
            const manual = context.eventName === "workflow_dispatch";
            let candidates;

            if (manual) {
              const tag = (process.env.REQUESTED_TAG || "").trim();
              const response = tag
                ? await github.rest.repos.getReleaseByTag({
                    ...upstream, tag
                  })
                : await github.rest.repos.getLatestRelease(upstream);

              candidates = [response.data];
            } else {
              const since = process.env.FRIDA_SINCE;
              if (!since || Number.isNaN(Date.parse(since))) {
                throw new Error(
                  "Set FRIDA_SINCE repository variable to an ISO timestamp"
                );
              }

              const releases = await github.paginate(
                github.rest.repos.listReleases,
                { ...upstream, per_page: 100 }
              );

              candidates = releases.filter(r =>
                !r.draft &&
                !r.prerelease &&
                r.published_at &&
                Date.parse(r.published_at) >= Date.parse(since)
              );
            }

            for (const r of candidates) {
              if (r.draft || r.prerelease ||
                  !/^\d+\.\d+\.\d+$/.test(r.tag_name)) {
                throw new Error(
                  `Expected stable numeric release tag: ${r.tag_name}`
                );
              }
            }

            const published = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 }
            );
            const byTag = new Map(published.map(r => [r.tag_name, r]));

            const pending = candidates
              .filter(r => {
                if (manual) return true;

                const local = byTag.get(
                  `frida-${r.tag_name}-roothide-arm64e`
                );
                const filename =
                  `frida_${r.tag_name}_iphoneos-arm64e.deb`;

                return !local || local.draft ||
                  !local.assets.some(a =>
                    a.name === filename &&
                    a.state === "uploaded" &&
                    a.size > 0
                  );
              })
              .sort((a, b) =>
                Date.parse(a.published_at) - Date.parse(b.published_at)
              );

            // Drain a large backlog over successive runs.
            const tags = pending.slice(0, 10).map(r => r.tag_name);
            core.info(`Versions to build: ${JSON.stringify(tags)}`);
            core.setOutput("matrix", JSON.stringify({ tag: tags }));
            core.setOutput("has_work", tags.length ? "true" : "false");

  build:
    needs: discover
    if: needs.discover.outputs.has_work == 'true'

    runs-on: macos-15
    timeout-minutes: 360

    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    env:
      FRIDA_TAG: ${{ matrix.tag }}
      IOS_CERTID: "-"
      MACOS_CERTID: "-"
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out upstream release and pinned submodules
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: refs/tags/${{ matrix.tag }}
          path: upstream
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare hosted runner
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install make dpkg
          command -v gmake
          command -v dpkg-deb
          command -v gh
          df -h .

      - name: Build package
        run: |
          set -o pipefail
          bash scripts/build-roothide.sh \
            "$GITHUB_WORKSPACE/upstream" \
            "$GITHUB_WORKSPACE/dist" \
            "$FRIDA_TAG" 2>&1 | tee build.log

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-${{ matrix.tag }}-roothide-arm64e
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag="frida-${FRIDA_TAG}-roothide-arm64e"
          upstream_commit="$(git -C upstream rev-parse HEAD)"

          cat > release-notes.md <<EOF
          Frida ${FRIDA_TAG} for RootHide.

          - Server: arm64e only, modern ABI.
          - Agent: arm64 + arm64e.
          - Debian architecture: iphoneos-arm64e.
          - Signing: ad-hoc; no developer certificate.
          - Upstream commit: ${upstream_commit}

          Upstream: https://github.com/frida/frida/releases/tag/${FRIDA_TAG}

          Automated build; not runtime-tested on a jailbroken device.
          EOF

          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Frida ${FRIDA_TAG} — RootHide arm64e" \
              --notes-file release-notes.md
          fi

          gh release upload "$release_tag" dist/* --clobber

          gh release edit "$release_tag" \
            --notes-file release-notes.md \
            --draft=false \
            --latest=false

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frida-${{ matrix.tag }}-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
